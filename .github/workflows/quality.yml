name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY: o gerador do sitemap usa o histórico real como evidência editorial.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar qualidade de produção
        run: npm run check
